<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interview Notes</title>
    <base href="./" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css"
    />
    <link rel="stylesheet" href="styles.css?v=20260904c" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <p class="brand">Interview Notes</p>
          <form class="site-search" role="search" id="site-search">
            <label class="visually-hidden" for="search-input">Search notes</label>
            <input
              type="search"
              id="search-input"
              placeholder="Search notes…"
              autocomplete="off"
              spellcheck="false"
              aria-autocomplete="list"
              aria-controls="search-results"
              aria-expanded="false"
            />
            <div
              class="search-results"
              id="search-results"
              role="listbox"
              hidden
            ></div>
          </form>
        </div>
        <nav class="topic-nav" aria-label="Notes">
          <ul class="topic-list" id="topic-list"></ul>
        </nav>
      </aside>

      <main class="content">
        <article class="article" id="article">
          <p class="placeholder">Loading notes…</p>
        </article>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js"></script>
    <script src="app.js?v=20260904c"></script>
  </body>
</html>
